[project]
name = "comfyui-anima-t8"
description = "Anima prompt workstation for ComfyUI with prompt presets, artist libraries, Danbooru and Gelbooru tag galleries, Civitai prompt import, and preview images."
version = "1.5.1"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/T8mars/comfyui-anima-t8"
"Bug Tracker" = "https://github.com/T8mars/comfyui-anima-t8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "Anima Prompt T8"
